spring.application.name=cadastro-clientes
server.port=8080

# ============================================================
# JWT
# ============================================================
# Em producao, exportar JWT_SECRET com string aleatoria >= 32 chars
app.jwt.secret=${JWT_SECRET:altis-dev-secret-MUDAR-em-producao-string-longa-256bits-aleatoria-trocar-isso}
app.jwt.expiration-ms=86400000

# ============================================================
# Upload multipart (avatar + fotos do album)
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ============================================================
# Oracle XEPDB1 - credenciais de desenvolvimento local
# Em producao, sobrescrever via variaveis de ambiente:
#   DB_USERNAME e DB_PASSWORD
# ============================================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=${DB_USERNAME:PROJETO}
spring.datasource.password=${DB_PASSWORD:Altis_2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ============================================================
# JPA / Hibernate
# ============================================================
# update: Hibernate cria/atualiza tabelas conforme as entities (DEV).
# Em prod: usar 'validate' + migracoes versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Logging
# ============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.br.com.altis=DEBUG
