<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-semibold" [routerLink]="auth.isAuthenticated() ? '/clientes' : '/login'">
      Cadastro de Clientes
    </a>

    @if (auth.isAuthenticated()) {
      <div class="d-flex align-items-center gap-3">
        <a routerLink="/clientes"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }"
           class="btn btn-outline-light btn-sm btn-nav">
          Clientes
        </a>

        <div class="dropdown">
          <button class="btn btn-link text-white d-flex align-items-center gap-2 text-decoration-none dropdown-toggle btn-nav"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false">
            <span class="avatar-circle d-flex align-items-center justify-content-center">
              {{ (auth.user()?.nome || '?').charAt(0).toUpperCase() }}
            </span>
            <span class="d-none d-md-inline">{{ auth.user()?.nome }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><span class="dropdown-item-text small text-muted">{{ auth.user()?.email }}</span></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item" type="button" (click)="sair()">Sair</button></li>
          </ul>
        </div>
      </div>
    }
  </div>
</nav>

<main class="container py-4 page-enter">
  <router-outlet></router-outlet>
</main>
